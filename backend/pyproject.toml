[project]
name = "mcp-stack-backend"
version = "0.1.0"
description = "Local API and configuration boundary for MCPStack"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "jsonschema[format]>=4.23,<5",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
mcpctl = "mcp_stack.cli:main"
mcp-stack-api = "mcp_stack.server:main"
mcp-stack-broker = "mcp_stack.broker.server:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "httpx2>=2,<3",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_stack"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
