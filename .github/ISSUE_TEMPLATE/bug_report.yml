name: Bug report
description: Report a reproducible problem (not a security vulnerability).
body:
  - type: markdown
    attributes:
      value: Please check the troubleshooting guide first. Redact keys, private URLs, usernames, and local configuration. Follow SECURITY.md for vulnerabilities.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, commit/version, installation method, and browser.
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      description: Never attach complete environments, real secret files, or operational databases.
